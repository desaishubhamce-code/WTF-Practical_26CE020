<svg viewBox="0 0 1400 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GreenLeaf Organics banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EFD8"/>
      <stop offset="55%" stop-color="#F3F4EC"/>
      <stop offset="100%" stop-color="#E9EEDD"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3C267" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F3C267" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BBE8B"/>
      <stop offset="100%" stop-color="#7FA96E"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E9C5D"/>
      <stop offset="100%" stop-color="#5B8C4C"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C7E40"/>
      <stop offset="100%" stop-color="#3E6B39"/>
    </linearGradient>
    <style>
      .leaf-sway{ transform-origin:center; animation:sway 4.5s ease-in-out infinite; }
      .leaf-sway.d2{ animation-delay:.6s; }
      .leaf-sway.d3{ animation-delay:1.2s; }
      @keyframes sway{
        0%,100%{ transform:rotate(-3deg); }
        50%{ transform:rotate(3deg); }
      }
      .sun-pulse{ animation:pulse 6s ease-in-out infinite; transform-origin:center; }
      @keyframes pulse{
        0%,100%{ opacity:.85; transform:scale(1); }
        50%{ opacity:1; transform:scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce){
        .leaf-sway, .sun-pulse{ animation:none !important; }
      }
    </style>
  </defs>

  <rect width="1400" height="460" fill="url(#sky)"/>

  <!-- sun -->
  <circle class="sun-pulse" cx="1180" cy="120" r="140" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="120" r="46" fill="#E9B04B"/>

  <!-- rolling hills -->
  <path d="M0 300 C 220 250, 420 340, 700 290 C 950 245, 1180 320, 1400 270 L1400 460 L0 460 Z" fill="url(#hillBack)"/>
  <path d="M0 340 C 260 300, 480 380, 760 330 C 1000 290, 1200 360, 1400 320 L1400 460 L0 460 Z" fill="url(#hillMid)"/>
  <path d="M0 390 C 240 360, 520 420, 800 380 C 1040 350, 1220 410, 1400 380 L1400 460 L0 460 Z" fill="url(#hillFront)"/>

  <!-- little crop rows on front hill -->
  <g stroke="#345C2B" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M60 430 L60 405"/><path d="M100 434 L100 406"/><path d="M140 430 L140 402"/>
    <path d="M180 436 L180 408"/><path d="M220 430 L220 404"/><path d="M260 434 L260 406"/>
    <path d="M300 430 L300 402"/><path d="M340 436 L340 408"/><path d="M1050 432 L1050 406"/>
    <path d="M1090 436 L1090 408"/><path d="M1130 430 L1130 404"/><path d="M1170 434 L1170 406"/>
    <path d="M1210 430 L1210 402"/><path d="M1250 436 L1250 408"/>
  </g>

  <!-- swaying leaf accents -->
  <g class="leaf-sway">
    <path d="M170 250 C 140 235, 130 205, 150 185 C 180 200, 190 232, 170 250Z" fill="#5B8C51" opacity="0.85"/>
  </g>
  <g class="leaf-sway d2">
    <path d="M1300 230 C 1270 215, 1262 188, 1282 168 C 1310 182, 1320 212, 1300 230Z" fill="#5B8C51" opacity="0.75"/>
  </g>
  <g class="leaf-sway d3">
    <path d="M90 210 C 66 198, 60 175, 78 158 C 102 170, 110 196, 90 210Z" fill="#7FA96E" opacity="0.7"/>
  </g>

  <!-- wordmark card -->
  <g>
    <path d="M56 118C56 118 30 106 30 78C30 60 44 46 62 44C80 46 94 60 94 78C94 106 56 118 56 118Z" fill="#3E6B39"/>
    <path d="M62 118V56" stroke="#F3F4EC" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#243421" font-weight="700">GreenLeaf Organics</text>
    <text x="121" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#3E6B39" letter-spacing="0.5">Freshness you can trust. Quality you can taste.</text>
  </g>
</svg>
